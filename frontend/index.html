<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Manager - Finance Asset Tracker</title>
    <script>
        (function () {
            var t = localStorage.getItem('wm-theme');
            if (t === 'light' || t === 'dark') {
                document.documentElement.setAttribute('data-theme', t);
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-app navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">💰 Wealth Manager</span>
            <div class="navbar-actions ms-auto">
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
                    <span class="icon-moon" aria-hidden="true">🌙</span>
                    <span class="icon-sun" aria-hidden="true">☀️</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Tabs Navigation -->
        <div class="row">
            <div class="col-12">
                <ul class="nav nav-tabs" id="assetTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard-content" type="button" role="tab">📊 Dashboard</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="fd-tab" data-bs-toggle="tab" data-bs-target="#fd-content" type="button" role="tab">Fixed Deposits</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="mf-tab" data-bs-toggle="tab" data-bs-target="#mf-content" type="button" role="tab">Mutual Funds</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="stocks-tab" data-bs-toggle="tab" data-bs-target="#stocks-content" type="button" role="tab">Stocks</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="bonds-tab" data-bs-toggle="tab" data-bs-target="#bonds-content" type="button" role="tab">RBI Bonds</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="ppf-tab" data-bs-toggle="tab" data-bs-target="#ppf-content" type="button" role="tab">PPF</button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content" id="assetTabContent">
                    <!-- Dashboard Tab -->
                    <div class="tab-pane fade show active" id="dashboard-content" role="tabpanel">
                        <div class="row mt-3">
                            <!-- Summary Cards -->
                            <div class="col-12 mb-4">
                                <div class="row">
                                    <div class="col-md-3 mb-3">
                                        <div class="card summary-card summary-card--fd">
                                            <div class="card-body text-center">
                                                <h6 class="card-title">Fixed Deposits</h6>
                                                <p class="summary-value" id="dashboard-fd">₹0</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <div class="card summary-card summary-card--mf">
                                            <div class="card-body text-center">
                                                <h6 class="card-title">Mutual Funds</h6>
                                                <p class="summary-value" id="dashboard-mf">₹0</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <div class="card summary-card summary-card--stocks">
                                            <div class="card-body text-center">
                                                <h6 class="card-title">Stocks</h6>
                                                <p class="summary-value" id="dashboard-stocks">₹0</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <div class="card summary-card summary-card--bonds">
                                            <div class="card-body text-center">
                                                <h6 class="card-title">RBI Bonds</h6>
                                                <p class="summary-value" id="dashboard-bonds">₹0</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <div class="card summary-card summary-card--ppf">
                                            <div class="card-body text-center">
                                                <h6 class="card-title">PPF</h6>
                                                <p class="summary-value" id="dashboard-ppf">₹0</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <div class="card summary-card summary-card--total">
                                            <div class="card-body text-center">
                                                <h6 class="card-title">Total Portfolio Value</h6>
                                                <p class="summary-value" id="dashboard-total">₹0</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Download Button -->
                            <div class="col-12 mb-4">
                                <button id="downloadExcelBtn" class="btn btn-success btn-lg">
                                    <i class="bi bi-download"></i> 📊 Download Excel Report
                                </button>
                            </div>

                            <!-- Charts -->
                            <div class="col-lg-6 mb-4">
                                <div class="card chart-card">
                                    <div class="card-body">
                                        <h5 class="card-title">Wealth Distribution</h5>
                                        <canvas id="wealthDistributionChart"></canvas>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-6 mb-4">
                                <div class="card chart-card">
                                    <div class="card-body">
                                        <h5 class="card-title">Asset Allocation</h5>
                                        <canvas id="assetAllocationChart"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="fd-content" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-body">
                                <h5 class="card-title">Add Fixed Deposit</h5>
                                <form id="fdForm">
                                    <input type="hidden" id="fdEditId" value="">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdBank" class="form-label">Bank Name</label>
                                                <input type="text" class="form-control" id="fdBank" placeholder="e.g., HDFC Bank" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdCustId" class="form-label">Customer ID</label>
                                                <input type="text" class="form-control" id="fdCustId" placeholder="e.g., CUST12345" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdNumber" class="form-label">FD Number</label>
                                                <input type="text" class="form-control" id="fdNumber" placeholder="e.g., FD0123456" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdPrincipal" class="form-label">Principal Amount (₹)</label>
                                                <input type="number" class="form-control" id="fdPrincipal" placeholder="100000" step="0.01" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdMaturityAmt" class="form-label">Maturity Amount (₹)</label>
                                                <input type="number" class="form-control" id="fdMaturityAmt" placeholder="105000" step="0.01" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdInterestAmt" class="form-label">Interest Amount (₹)</label>
                                                <input type="number" class="form-control" id="fdInterestAmt" placeholder="5000" step="0.01" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdRate" class="form-label">Interest Rate (%)</label>
                                                <input type="number" class="form-control" id="fdRate" placeholder="5.5" step="0.01" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="fdTenure" class="form-label">Tenure (Months)</label>
                                                <input type="number" class="form-control" id="fdTenure" placeholder="12" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="fdMaturity" class="form-label">Maturity Date</label>
                                        <input type="date" class="form-control" id="fdMaturity" required>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary" id="fdAddBtn">Add Fixed Deposit</button>
                                        <button type="submit" class="btn btn-success" id="fdUpdateBtn" style="display:none;">Update Fixed Deposit</button>
                                        <button type="button" class="btn btn-secondary" id="fdCancelBtn" style="display:none;" onclick="resetFDForm()">Cancel Edit</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div id="fdList" class="mt-4"></div>
                    </div>

                    <!-- Mutual Funds Tab -->
                    <div class="tab-pane fade" id="mf-content" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-body">
                                <h5 class="card-title">Add Mutual Fund</h5>
                                <form id="mfForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="mfName" class="form-label">Fund Name</label>
                                                <input type="text" class="form-control" id="mfName" placeholder="e.g., HDFC Growth Fund" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="mfUnits" class="form-label">Units</label>
                                                <input type="number" class="form-control" id="mfUnits" placeholder="100" step="0.01" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="mfNAV" class="form-label">NAV (₹)</label>
                                                <input type="number" class="form-control" id="mfNAV" placeholder="500" step="0.01" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="mfPurchase" class="form-label">Purchase Date</label>
                                                <input type="date" class="form-control" id="mfPurchase" required>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Add Mutual Fund</button>
                                </form>
                            </div>
                        </div>
                        <div id="mfList" class="mt-4"></div>
                    </div>

                    <!-- Stocks Tab -->
                    <div class="tab-pane fade" id="stocks-content" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-body">
                                <h5 class="card-title">Add Stock</h5>
                                <form id="stocksForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="stockName" class="form-label">Stock Name</label>
                                                <input type="text" class="form-control" id="stockName" placeholder="e.g., Reliance Industries" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="stockSymbol" class="form-label">Stock Symbol</label>
                                                <input type="text" class="form-control" id="stockSymbol" placeholder="e.g., RELIANCE" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="stockQty" class="form-label">Quantity</label>
                                                <input type="number" class="form-control" id="stockQty" placeholder="10" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="stockPurchasePrice" class="form-label">Purchase Price (₹)</label>
                                                <input type="number" class="form-control" id="stockPurchasePrice" placeholder="2500" step="0.01" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="stockCurrentPrice" class="form-label">Current Price (₹)</label>
                                                <input type="number" class="form-control" id="stockCurrentPrice" placeholder="2750" step="0.01" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="stockPurchase" class="form-label">Purchase Date</label>
                                                <input type="date" class="form-control" id="stockPurchase" required>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Add Stock</button>
                                </form>
                            </div>
                        </div>
                        <div id="stocksList" class="mt-4"></div>
                    </div>

                    <!-- RBI Bonds Tab -->
                    <div class="tab-pane fade" id="bonds-content" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-body">
                                <h5 class="card-title">Add RBI Bond</h5>
                                <form id="bondsForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="bondType" class="form-label">Bond Type</label>
                                                <select class="form-select" id="bondType" required>
                                                    <option>Sovereign Gold Bonds</option>
                                                    <option>RBI Floating Rate Bonds</option>
                                                    <option>RBI Taxable Bonds</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="bondAmount" class="form-label">Amount (₹)</label>
                                                <input type="number" class="form-control" id="bondAmount" placeholder="50000" step="0.01" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="bondRate" class="form-label">Interest Rate (%)</label>
                                                <input type="number" class="form-control" id="bondRate" placeholder="6.26" step="0.01" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="bondTenure" class="form-label">Tenure (Years)</label>
                                                <input type="number" class="form-control" id="bondTenure" placeholder="7" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="bondPurchase" class="form-label">Purchase Date</label>
                                                <input type="date" class="form-control" id="bondPurchase" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="bondMaturity" class="form-label">Maturity Date</label>
                                                <input type="date" class="form-control" id="bondMaturity" required>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Add RBI Bond</button>
                                </form>
                            </div>
                        </div>
                        <div id="bondsList" class="mt-4"></div>
                    </div>

                    <!-- PPF Tab -->
                    <div class="tab-pane fade" id="ppf-content" role="tabpanel">
                        <div class="card mt-3">
                            <div class="card-body">
                                <h5 class="card-title">Add PPF Contribution</h5>
                                <form id="ppfForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="ppfAccount" class="form-label">PPF Account Number</label>
                                                <input type="text" class="form-control" id="ppfAccount" placeholder="123-4567-8901" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="ppfYear" class="form-label">Financial Year</label>
                                                <input type="text" class="form-control" id="ppfYear" placeholder="2024-25" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="ppfAmount" class="form-label">Contribution Amount (₹)</label>
                                                <input type="number" class="form-control" id="ppfAmount" placeholder="150000" step="0.01" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="ppfRate" class="form-label">Interest Rate (%)</label>
                                                <input type="number" class="form-control" id="ppfRate" placeholder="7.1" step="0.01" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="ppfMaturityYear" class="form-label">Maturity Year</label>
                                        <input type="number" class="form-control" id="ppfMaturityYear" placeholder="2033" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Add PPF Contribution</button>
                                </form>
                            </div>
                        </div>
                        <div id="ppfList" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
